        const EmberSteamCanvas = () => {
            const canvasRef = useRef(null);

            useEffect(() => {
                const canvas = canvasRef.current;
                if (!canvas) return;
                const ctx = canvas.getContext('2d');
                let animationFrameId;

                const resizeCanvas = () => {
                    canvas.width = window.innerWidth;
                    canvas.height = window.innerHeight;
                };
                resizeCanvas();
                window.addEventListener('resize', resizeCanvas);

                // Create particles
                const particleCount = 45;
                const particles = Array.from({ length: particleCount }, () => ({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    size: Math.random() * 2.5 + 0.5,
                    speedY: Math.random() * 0.8 + 0.2,
                    speedX: (Math.random() - 0.5) * 0.4,
                    opacity: Math.random() * 0.6 + 0.2,
                    color: Math.random() > 0.4 ? 'rgba(234, 179, 8, ' : 'rgba(249, 115, 22, '
                }));

                const render = () => {
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    
                    particles.forEach(p => {
                        p.y -= p.speedY;
                        p.x += p.speedX;

                        if (p.y < 0) {
                            p.y = canvas.height + 10;
                            p.x = Math.random() * canvas.width;
                        }

                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fillStyle = `${p.color}${p.opacity})`;
                        ctx.shadowBlur = 10;
                        ctx.shadowColor = 'rgba(234, 179, 8, 0.5)';
                        ctx.fill();
                    });

                    animationFrameId = requestAnimationFrame(render);
                };

                render();

                return () => {
                    window.removeEventListener('resize', resizeCanvas);
                    cancelAnimationFrame(animationFrameId);
                };
            }, []);

            return (
                <canvas 
                    ref={canvasRef} 
                    className="fixed inset-0 pointer-events-none z-10 opacity-70"
                />
            );
        };

                                                    title="Special Requests"
                                                >
                                                    Customize
                                                </button>
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            </section>

                            {}
                            <section id="reserve" className="py-24 bg-stone-950/90 border-t border-stone-800/50">
                                <div className="max-w-4xl mx-auto px-4 sm:px-6 lg:px-8">
                                    <div className="glass-card p-8 sm:p-12 rounded-3xl relative overflow-hidden">
                                        <div className="text-center mb-10">
                                            <span className="text-gold-500 text-xs font-semibold uppercase tracking-widest">Table Reservations</span>
                                            <h2 className="font-serif text-3xl sm:text-5xl font-normal text-stone-100 mt-2">
                                                Book Your WILLSEAT Experience
                                            </h2>
                                            <p className="text-stone-400 text-sm mt-2">Instant table confirmation for groups, romance, and VIP dining in Victoria Island.</p>
                                        </div>

                                        {reservationCode ? (
                                            <div className="text-center p-8 bg-gold-500/10 border border-gold-500/30 rounded-2xl space-y-4">
                                                <div className="w-12 h-12 bg-gold-500 text-stone-950 rounded-full flex items-center justify-center mx-auto text-xl font-bold">✓</div>
                                                <h3 className="font-serif text-2xl font-bold text-stone-100">Table Reserved Successfully</h3>
                                                <p className="text-stone-300 text-sm">Your confirmation reference is:</p>
                                                <div className="font-mono text-2xl font-bold text-gold-400 tracking-wider bg-stone-950 py-3 px-6 rounded-xl inline-block border border-gold-500/20">
                                                    {reservationCode}
                                                </div>
                                                <p className="text-xs text-stone-400">A confirmation SMS & Email notification has been generated.</p>
                                                <button 
                                                    onClick={() => setReservationCode(null)}
                                                    className="mt-4 px-6 py-2.5 text-xs font-semibold bg-stone-900 hover:bg-stone-800 text-stone-200 rounded-xl border border-stone-700"
                                                >
                                                    Make Another Reservation
                                                </button>
                                            </div>
                                        ) : (
                                            <form onSubmit={handleReservationSubmit} className="space-y-6">
                                                <div className="grid grid-cols-1 sm:grid-cols-2 gap-6">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">Full Name</label>
                                                        <input 
                                                            required
                                                            type="text" 
                                                            placeholder="Dr. Tayo Adebayo"
                                                            value={reservationForm.name}
                                                            onChange={(e) => setReservationForm({ ...reservationForm, name: e.target.value })}
                                                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-gold-500"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">Phone Number</label>
                                                        <input 
                                                            required
                                                            type="tel" 
                                                            placeholder="+234 800 000 0000"
                                                            value={reservationForm.phone}
                                                            onChange={(e) => setReservationForm({ ...reservationForm, phone: e.target.value })}
                                                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-gold-500"
                                                        />
                                                    </div>
                                                </div>

                                                <div className="grid grid-cols-1 sm:grid-cols-3 gap-6">
                                                    <div>
                                                        <label className="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">Number of Guests</label>
                                                        <input 
                                                            required
                                                            type="number" 
                                                            min="1"
                                                            max="16"
                                                            value={reservationForm.guests}
                                                            onChange={(e) => setReservationForm({ ...reservationForm, guests: parseInt(e.target.value) || 1 })}
                                                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-gold-500"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">Date</label>
                                                        <input 
                                                            required
                                                            type="date" 
                                                            value={reservationForm.date}
                                                            onChange={(e) => setReservationForm({ ...reservationForm, date: e.target.value })}
                                                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-gold-500"
                                                        />
                                                    </div>
                                                    <div>
                                                        <label className="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">Time Slot</label>
                                                        <select 
                                                            value={reservationForm.time}
                                                            onChange={(e) => setReservationForm({ ...reservationForm, time: e.target.value })}
                                                            className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-gold-500"
                                                        >
                                                            <option value="18:00">18:00 (Dinner First Seating)</option>
                                                            <option value="19:30">19:30 (Prime Dinner)</option>
                                                            <option value="21:00">21:00 (Late Night Fine Dining)</option>
                                                        </select>
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">Seating Preference</label>
                                                    <div className="grid grid-cols-3 gap-3">
                                                        {['Main Fine Dining', 'VIP Lounge', 'Terrace'].map((area) => (
                                                            <button
                                                                type="button"
                                                                key={area}
                                                                onClick={() => setReservationForm({ ...reservationForm, area })}
                                                                className={`p-3 rounded-xl text-xs font-medium border transition-all ${
                                                                    reservationForm.area === area 
                                                                        ? 'bg-gold-500/20 text-gold-400 border-gold-500' 
                                                                        : 'bg-stone-900 text-stone-400 border-stone-800'
                                                                }`}
                                                            >
                                                                {area}
                                                            </button>
                                                        ))}
                                                    </div>
                                                </div>

                                                <div>
                                                    <label className="block text-xs font-semibold text-stone-300 uppercase tracking-wider mb-2">Special Requests / Dietary Notes</label>
                                                    <textarea 
                                                        rows="3"
                                                        placeholder="Anniversary, birthday cake request, allergy requirements..."
                                                        value={reservationForm.notes}
                                                        onChange={(e) => setReservationForm({ ...reservationForm, notes: e.target.value })}
                                                        className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-gold-500"
                                                    />
                                                </div>

                                                <button 
                                                    type="submit"
                                                    className="w-full py-4 rounded-xl bg-gold-500 hover:bg-gold-400 text-stone-950 font-bold text-xs uppercase tracking-widest transition-all shadow-lg shadow-gold-500/20"
                                                >
                                                    Confirm Reservation Request
                                                </button>
                                            </form>
                                        )}
                                    </div>
                                </div>
                            </section>
                        </main>
                    )}

                    {}
                    {isCartOpen && (
                        <div className="fixed inset-0 z-50 overflow-hidden">
                            <div className="absolute inset-0 bg-stone-950/80 backdrop-blur-sm" onClick={() => setIsCartOpen(false)} />
                            <div className="absolute inset-y-0 right-0 max-w-full flex pl-10">
                                <div className="w-screen max-w-md glass-panel border-l border-stone-800 p-6 flex flex-col justify-between">
                                    <div>
                                        <div className="flex items-center justify-between border-b border-stone-800 pb-4">
                                            <h2 className="font-serif text-2xl font-bold text-stone-100 flex items-center gap-2">
                                                <Icon name="shoppingBag" className="w-6 h-6 text-gold-400" /> Your Order
                                            </h2>
                                            <button onClick={() => setIsCartOpen(false)} className="text-stone-400 hover:text-white">
                                                <Icon name="close" className="w-6 h-6" />
                                            </button>
                                        </div>

                                        {checkoutSuccess ? (
                                            <div className="py-12 text-center space-y-4">
                                                <div className="w-12 h-12 rounded-full bg-emerald-500/20 text-emerald-400 flex items-center justify-center mx-auto text-xl">✓</div>
                                                <h3 className="font-serif text-2xl font-bold text-stone-100">Order Placed!</h3>
                                                <p className="text-xs text-stone-300">Order Reference Number:</p>
                                                <div className="font-mono text-xl font-bold text-gold-400 bg-stone-950 p-3 rounded-xl border border-stone-800">
                                                    {checkoutSuccess}
                                                </div>
                                                <p className="text-xs text-stone-400">Our brigade is preparing your culinary experience.</p>
                                                <button 
                                                    onClick={() => setCheckoutSuccess(null)}
                                                    className="mt-4 px-6 py-2 text-xs font-semibold bg-stone-900 text-stone-200 rounded-lg"
                                                >
                                                    Close
                                                </button>
                                            </div>
                                        ) : cart.length === 0 ? (
                                            <div className="py-16 text-center text-stone-500 space-y-2">
                                                <p className="text-sm">Your order drawer is currently empty.</p>
                                                <p className="text-xs text-stone-600">Select dishes from our menu to begin.</p>
                                            </div>
                                        ) : (
                                            <div className="py-4 space-y-4 max-h-[60vh] overflow-y-auto pr-2">
                                                {cart.map(item => (
                                                    <div key={item.cartId} className="p-3 bg-stone-900/80 rounded-xl border border-stone-800 flex items-center justify-between">
                                                        <div>
                                                            <div className="text-xs font-semibold text-stone-200">{item.name}</div>
                                                            <div className="text-[11px] text-gold-400">{formatNGN(item.price)}</div>
                                                            {item.notes && <div className="text-[10px] text-stone-400 italic mt-0.5">Note: {item.notes}</div>}
                                                        </div>
                                                        <div className="flex items-center gap-2 bg-stone-950 px-2 py-1 rounded-lg border border-stone-800">
                                                            <button onClick={() => updateCartQuantity(item.cartId, -1)} className="text-stone-400 hover:text-white">
                                                                <Icon name="minus" className="w-3.5 h-3.5" />
                                                            </button>
                                                            <span className="text-xs font-bold text-stone-200 w-4 text-center">{item.quantity}</span>
                                                            <button onClick={() => updateCartQuantity(item.cartId, 1)} className="text-stone-400 hover:text-white">
                                                                <Icon name="plus" className="w-3.5 h-3.5" />
                                                            </button>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </div>

                                    {cart.length > 0 && !checkoutSuccess && (
                                        <div className="border-t border-stone-800 pt-4 space-y-4">
                                            <div className="flex justify-between text-sm text-stone-300">
                                                <span>Subtotal</span>
                                                <span className="font-mono font-bold text-gold-400">{formatNGN(cartTotal)}</span>
                                            </div>
                                            <button 
                                                onClick={handleCheckout}
                                                className="w-full py-3.5 rounded-xl bg-gold-500 hover:bg-gold-400 text-stone-950 font-bold text-xs uppercase tracking-widest transition-all"
                                            >
                                                Confirm & Submit Order
                                            </button>
                                        </div>
                                    )}
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Dish Customization Modal */}
                    {customizingItem && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-stone-950/80 backdrop-blur-sm">
                            <div className="glass-panel p-6 rounded-2xl max-w-md w-full space-y-4">
                                <h3 className="font-serif text-xl font-bold text-stone-100">Customize {customizingItem.name}</h3>
                                <textarea 
                                    rows="3"
                                    placeholder="E.g., Mild spice level, extra plantain crisp, no onion..."
                                    value={customNotes}
                                    onChange={(e) => setCustomNotes(e.target.value)}
                                    className="w-full bg-stone-900 border border-stone-800 rounded-xl p-3 text-xs text-stone-200 focus:outline-none focus:border-gold-500"
                                />
                                <div className="flex gap-3">
                                    <button onClick={() => setCustomizingItem(null)} className="flex-1 py-2 rounded-xl bg-stone-900 text-stone-400 text-xs">Cancel</button>
                                    <button onClick={() => addToCart(customizingItem, customNotes)} className="flex-1 py-2 rounded-xl bg-gold-500 text-stone-950 text-xs font-bold">Add to Order</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {}
                    <footer className="bg-stone-950 border-t border-stone-900 py-12 z-20">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="grid grid-cols-1 md:grid-cols-3 gap-8 mb-12">
                                <div>
                                    <span className="font-serif text-2xl font-bold text-stone-100 tracking-widest">
                                        WILL<span className="text-gold-500">SEAT</span>
                                    </span>
                                    <p className="text-stone-400 text-xs mt-3 leading-relaxed">
                                        Victoria Island’s premier luxury dining venue celebrating indigenous ingredients through contemporary gastronomic techniques.
                                    </p>
                                </div>

                                <div>
                                    <h4 className="text-xs font-bold text-stone-200 uppercase tracking-widest mb-3">Restaurant Location (Demo)</h4>
                                    <p className="text-stone-400 text-xs leading-relaxed flex items-center gap-2">
                                        <Icon name="location" className="w-4 h-4 text-gold-400" />
                                        Plot 14 Water Corporation Drive, Victoria Island, Lagos, Nigeria
                                    </p>
                                    <p className="text-stone-400 text-xs mt-2 flex items-center gap-2">
                                        <Icon name="phone" className="w-4 h-4 text-gold-400" />
                                        +234 (0) 1 800 WILLSEAT
                                    </p>
                                </div>

                                <div>
                                    <h4 className="text-xs font-bold text-stone-200 uppercase tracking-widest mb-3">Hours of Hospitality</h4>
                                    <p className="text-stone-400 text-xs">Tuesday – Sunday: 17:00 – 23:30</p>
                                    <p className="text-stone-400 text-xs mt-1">Monday: Closed for Culinary R&D</p>
                                </div>
                            </div>

                            {/* Separated Developer Info Banner */}
                            <div className="pt-8 border-t border-stone-900 flex flex-col sm:flex-row items-center justify-between text-xs text-stone-500 gap-4">
                                <p>© 2026 WILLSEAT Fine Dining Ltd. All Rights Reserved.</p>
                                
                                <div className="p-3 glass-card rounded-xl border border-stone-800 text-right flex items-center gap-4">
                                    <span className="text-gold-400 font-medium">Engineered & Developed by:</span>
                                    <div className="text-stone-300 font-semibold text-left">
                                        <div>Willstech</div>
                                        <div className="text-[11px] font-mono text-stone-400">Phone: 0708 868 6355 | Email: devwillstech@gmail.com</div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        /* Mount Root App */
        const rootElement = document.getElementById('root');
        const root = ReactDOM.createRoot(rootElement);
        root.render(<App />);
    </script>
</body>
</html>
